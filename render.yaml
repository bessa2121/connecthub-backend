# Blueprint do Render: cria o serviço da API a partir do Dockerfile.
services:
  - type: web
    name: connecthub-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL       # cole a connection string do Neon
        sync: false
      - key: ALLOWED_ORIGINS    # URL do front-end (ex.: https://connecthub.vercel.app)
        sync: false
      - key: BREVO_API_KEY      # chave da API do Brevo (envio do código de confirmação)
        sync: false
      - key: BREVO_SENDER_EMAIL # e-mail do remetente validado no Brevo
        sync: false
      - key: BREVO_SENDER_NAME  # nome exibido (ex.: ConnectHub)
        sync: false
      - key: SEED_DEMO          # demo cria contas com senha pública: deixe "false" em produção
        value: "false"
